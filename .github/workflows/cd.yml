name: CD

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Debug repository identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Ref: $GITHUB_REF"
          echo "Environment: dev"




      
      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null)

          echo "OIDC issuer: $(echo "$PAYLOAD" | jq -r '.iss')"
          echo "OIDC audience: $(echo "$PAYLOAD" | jq -r '.aud')"
          echo "OIDC subject: $(echo "$PAYLOAD" | jq -r '.sub')"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.terraform_action == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
